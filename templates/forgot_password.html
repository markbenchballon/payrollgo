<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password – Payroll System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        position: relative;
        overflow: hidden;
    }

    body::before, body::after {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        filter: blur(80px);
    }
    body::before { top: -100px; left: -100px; }
    body::after  { bottom: -100px; right: -100px; }

    .box {
        width: 380px;
        padding: 45px 35px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(15px);
        border-radius: 18px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        text-align: center;
        color: #fff;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .box h2   { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .box p    { font-size: 13px; opacity: 0.8; margin-bottom: 28px; line-height: 1.6; }

    .input-group {
        position: relative;
        margin-bottom: 22px;
    }

    .input-group input {
        width: 100%;
        padding: 14px;
        border: none;
        outline: none;
        border-radius: 10px;
        font-size: 15px;
        background: rgba(255,255,255,0.85);
        color: #333;
    }

    .input-group label {
        position: absolute;
        top: 50%;
        left: 14px;
        font-size: 14px;
        color: #777;
        transform: translateY(-50%);
        pointer-events: none;
        transition: 0.3s;
        background: transparent;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
        top: -7px;
        left: 10px;
        font-size: 12px;
        color: #0f2027;
        background: #fff;
        padding: 0 6px;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #1d976c, #93f9b9);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.25); }

    .msg-error   { margin-top: 16px; font-size: 14px; color: #ffb3b3; }
    .msg-success { margin-top: 16px; font-size: 14px; color: #b3ffcc; }

    .back-link { margin-top: 18px; font-size: 13px; }
    .back-link a { color: #e0f2ff; text-decoration: none; }
    .back-link a:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="box">
    <h2>Forgot Password</h2>
    <p>Enter your registered email address or username.<br>We'll send a one-time password (OTP) to your email.</p>

    <form method="POST" action="/forgot-password">
        <div class="input-group">
            <input type="text" name="identifier" required placeholder=" " id="identifier">
            <label for="identifier">Username or Email</label>
        </div>

        <button type="submit">Send OTP</button>
    </form>

    {{if .error}}
    <div class="msg-error">{{.error}}</div>
    {{end}}

    {{if .success}}
    <div class="msg-success">
        {{.success}}<br>
        <a href="/reset-password" style="color:#b3ffcc; font-weight:600;">Click here to reset your password →</a>
    </div>
    {{end}}

    <div class="back-link">
        <a href="/">← Back to Login</a>
    </div>
</div>

<script>
    const identifier = document.getElementById('identifier');

    identifier.setAttribute('maxlength', '30');

    identifier.addEventListener('input', function () {
        const cleaned = this.value.replace(/\s/g, '');
        if (this.value !== cleaned) this.value = cleaned;
    });

    identifier.addEventListener('paste', function (e) {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text');
        const cleaned = pasted.replace(/\s/g, '').slice(0, 30);
        document.execCommand('insertText', false, cleaned);
    });

    document.querySelector('form').addEventListener('submit', function (e) {
        if (!identifier.value.includes('@')) {
            e.preventDefault();
            alert('⚠️ Please enter a valid email address with @.');
        }
    });
</script>

</body>
</html>
