<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New User - Payroll GO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #eef2f7;
}

.dashboard {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 240px;
    background: linear-gradient(180deg, #3f5efb, #4b7bec);
    color: #fff;
    padding: 25px 20px;
}

.sidebar h2 {
    font-size: 22px;
    margin-bottom: 40px;
}

.sidebar ul {
    list-style: none;
}

.sidebar ul li {
    margin-bottom: 18px;
}

.sidebar ul li a {
    color: #eaf0ff;
    text-decoration: none;
    display: block;
    padding: 10px 14px;
    border-radius: 10px;
    transition: background 0.3s;
    font-size: 14px;
}

.sidebar ul li a:hover,
.sidebar ul li a.active {
    background: rgba(255,255,255,0.2);
}

.main {
    flex: 1;
    padding: 25px 35px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.topbar h1 {
    font-size: 26px;
    color: #2c3e50;
}

.date {
    font-size: 14px;
    color: #7f8c8d;
}

.message {
    padding: 15px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.message.error { 
    background: #fee2e2; 
    color: #b91c1c;
    border-left: 4px solid #dc2626;
}

.message.success { 
    background: #d1fae5; 
    color: #065f46;
    border-left: 4px solid #10b981;
}

.form-container {
    background: white;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    max-width: 600px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #374151;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #4f46e5;
    outline: none;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.required {
    color: #ef4444;
}

.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.btn {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: #4f46e5;
    color: white;
}

.btn-primary:hover {
    background: #4338ca;
    transform: translateY(-2px);
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

.btn-secondary:hover {
    background: #4b5563;
}

.help-text {
    font-size: 13px;
    color: #6b7280;
    margin-top: 5px;
}

@media (max-width: 768px) {
    .sidebar {
        display: none;
    }
    
    .btn-group {
        flex-direction: column;
    }
}
</style>
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>Payroll</h2>
        <ul>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/admin/employees">Employees</a></li>
            <li><a href="/admin/payroll">Payroll</a></li>
            <li><a href="/admin/reports">Reports</a></li>
            <li><a class="active" href="/users">Users</a></li>
            <li><a href="/admin/settings">Settings</a></li>
        </ul>
    </aside>

    <main class="main">

        <div class="topbar">
            <h1>➕ Add New User</h1>
            <div class="date">{{.date}}</div>
        </div>

        {{if .error}}
        <div class="message error">❌ {{.error}}</div>
        {{end}}

        <div class="form-container">
            <form method="POST" action="/users/add">
                
                <div class="form-group">
                    <label>Username <span class="required">*</span></label>
                    <input type="text" name="username" required placeholder="e.g., jdoe">
                    <p class="help-text">Unique username for login (lowercase, no spaces)</p>
                </div>

                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" name="name" required placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" name="gmail" required placeholder="e.g., john.doe@company.com">
                </div>

                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" name="password" required placeholder="Minimum 6 characters">
                    <p class="help-text">Must be at least 6 characters long</p>
                </div>

                <div class="form-group">
                    <label>Role <span class="required">*</span></label>
                    <select name="role" required>
                        <option value="">-- Select Role --</option>
                        <option value="admin">👑 Admin</option>
                        <option value="hr">👔 HR</option>
                        <option value="manager">📊 Manager</option>
                        <option value="supervisor">👥 Supervisor</option>
                        <option value="employee">👤 Employee</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">✅ Create User</button>
                    <a href="/users" class="btn btn-secondary">❌ Cancel</a>
                </div>

            </form>
        </div>

    </main>
</div>

</body>
</html>
